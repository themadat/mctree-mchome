name: Deploy to GitHub Pages

# Production: main -> https://themadat.github.io/mctree-mchome/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prepare runtime-only site
        run: |
          mkdir -p build/pages/assets
          cp index.html manifest.webmanifest manifest-dark.webmanifest sw.js build/pages/
          cp -R assets/css assets/js assets/icons build/pages/assets/
          touch build/pages/.nojekyll

      - name: Publish production site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/pages
          keep_files: false
          commit_message: "Deploy production from ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

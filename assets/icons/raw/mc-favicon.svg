<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main M shape -->
  <g fill="none" stroke="#2F4F2F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20,84 L20,32 L50,58 L80,32 L80,84"/>
  </g>

  <!-- Branches growing from the M's peaks, and roots at its base -->
  <g fill="none" stroke="#2F4F2F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- top-left branch -->
    <path d="M20,32 L10,20"/>
    <path d="M20,32 L28,15"/>
    <!-- top-right branch -->
    <path d="M80,32 L90,20"/>
    <path d="M80,32 L72,15"/>
    <!-- middle branch -->
    <path d="M50,58 L50,44"/>
    <path d="M50,44 L43,38"/>
    <path d="M50,44 L57,38"/>
    <!-- roots, left leg -->
    <path d="M20,84 L12,92"/>
    <path d="M20,84 L27,91"/>
    <!-- roots, right leg -->
    <path d="M80,84 L88,92"/>
    <path d="M80,84 L73,91"/>
  </g>

  <!-- Leaves -->
  <g fill="#2F4F2F">
    <circle cx="10" cy="20" r="4"/>
    <circle cx="28" cy="15" r="4"/>
    <circle cx="90" cy="20" r="4"/>
    <circle cx="72" cy="15" r="4"/>
    <circle cx="43" cy="38" r="4"/>
    <circle cx="57" cy="38" r="4"/>
  </g>
</svg>

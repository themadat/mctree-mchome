<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outline 122 visual check</title>
  <link rel="stylesheet" href="assets/css/app.css?v=0.0.1.122">
  <style>body{margin:0;padding:24px;background:var(--page)}.tree-panel{min-height:430px}</style>
</head>
<body>
  <section class="tree-panel outline-panel workspace-card" aria-label="Outline">
    <header class="tree-toolbar outline-toolbar"><div class="tree-view-controls outline-view-controls">
      <div class="tree-control-section workspace-view-setting"><span class="tree-control-heading">View</span><div class="segmented workspace-view-switch" role="group" aria-label="Family view"><button type="button" class="tree-option-action"><span class="tree-option-icon">♧</span><span>Tree</span></button><button type="button" class="tree-option-action" aria-pressed="true"><span class="tree-option-icon">≡</span><span>Outline</span></button></div></div>
      <div class="tree-control-section tree-name-preferences"><span class="tree-control-heading">Name Preferences</span><div class="tree-name-controls" role="group" aria-label="Name preferences"><div class="tree-name-setting tree-name-source"><div class="segmented"><button type="button" class="tree-name-option" aria-pressed="true">Preferred<small>Display</small></button><button type="button" class="tree-name-option">Legal<small>Current</small></button><button type="button" class="tree-name-option">Lineal<small>Birth</small></button></div></div><div class="tree-name-setting tree-name-length"><div class="segmented"><button type="button" class="tree-name-option" aria-pressed="true">Short</button><button type="button" class="tree-name-option">Full</button></div></div></div></div>
      <div class="tree-control-section outline-root-setting"><span class="tree-control-heading">Root</span><div class="outline-root-controls"><details class="outline-root-picker"><summary aria-label="Choose Outline root. Current root: Root Ancestor. 23 people in this Outline"><span class="outline-root-name">Root Ancestor</span><span class="count-pill outline-root-count">23 people</span></summary><div class="outline-root-menu"><label class="outline-root-search-field"><span class="visually-hidden">Search Lineage people</span><input id="outlineRootSearch" type="search" placeholder="Search Lineage"></label><div class="outline-root-options" role="listbox"><button type="button" role="option" aria-selected="true"><strong>Root Ancestor</strong><small>(1900 – 1980)</small></button></div><small class="outline-root-result-count">1 person</small></div></details></div></div>
      <div class="outline-actions" role="group" aria-label="Outline controls"><button class="outline-action"><span class="outline-action-icon">↤</span><span>Reset Root</span></button><button class="outline-action"><span class="outline-action-icon">⌄</span><span>Expand all</span></button><button class="outline-action"><span class="outline-action-icon">⌃</span><span>Condense all</span></button><button class="outline-action"><span class="outline-action-icon">⌁</span><span>Lineage</span></button><button class="outline-action"><span class="outline-action-icon">▣</span><span>Print</span></button></div>
    </div></header>
    <div class="outline-scroll"><div class="descendant-outline" role="tree">
      <div class="outline-row outline-root-row" style="--outline-offset:0rem"><button class="outline-branch-toggle">⌄</button><span class="outline-generation">G1</span><button class="outline-person"><strong>Root Ancestor With A Full Name</strong><small>(1900 – 1980)</small></button><span class="outline-partners"><span class="outline-partner"><span class="outline-relationship"><span></span><small><span>Marriage</span><span>June 1, 1928</span></small></span><button class="outline-person outline-spouse"><strong>Latest Spouse</strong><small>(1904 – 1990)</small></button></span></span><span class="outline-scan-bar"></span></div>
      <div class="outline-row" style="--outline-offset:2rem"><span class="outline-toggle-placeholder">•</span><span class="outline-generation">G2</span><button class="outline-person"><strong>Lineal Child</strong><small>(1930 – 2010)</small></button><span class="outline-partners"><span class="outline-partner"><span class="outline-relationship"><span></span><small><span>Relationship</span><span>1954</span></small></span><button class="outline-person outline-spouse"><strong>A Spouse With A Much Longer Name</strong><small>(1932 – )</small></button></span></span><span class="outline-scan-bar"></span></div>
    </div></div>
  </section>
</body>
</html>
